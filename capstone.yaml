version: "1.0"
name: "flyrank-capstone-image-relevance"
run: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "python -m app.seed"
test: "pytest"
base_url: "http://localhost:8000"
endpoints:
  ingest_batch: "POST /api/batch/ingest"
  get_matches: "GET /api/posts/{id}/images"
  review_match: "POST /api/review"